# Refresh long-lived Facebook user token (IG_ACCESS_TOKEN) + health check.
# Bulanan: 08:00 WITA tanggal 1 (00:00 UTC).
# Mingguan: Senin 09:00 WITA (01:00 UTC) — health check, atau exchange jika
# FB_APP_ID + FB_APP_SECRET sudah diisi.
# GITHUB_TOKEN otomatis tidak bisa menulis secret — wajib secret GH_PAT untuk exchange.
name: refresh-ig-token
on:
  schedule:
    - cron: "0 0 1 * *"
    - cron: "0 1 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Ambil main terbaru SETELAH antrean concurrency selesai,
          # supaya job kedua (GitHub cron + cron-job.org) membaca state yang sudah di-commit.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Refresh atau health check token IG
        env:
          PYTHONPATH: src
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN || secrets.IG_TOKEN }}
          IG_TOKEN: ${{ secrets.IG_ACCESS_TOKEN || secrets.IG_TOKEN }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST || 'graph.facebook.com' }}
          IG_GRAPH_VERSION: ${{ vars.IG_GRAPH_VERSION || 'v21.0' }}
          FB_APP_ID: ${{ secrets.FB_APP_ID || vars.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m reels_autopilot refresh-ig-token

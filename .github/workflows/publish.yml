# Lima slot WITA (UTC+8):
# 07:30 → 23:30 UTC, 12:00 → 04:00, 17:00 → 09:00, 19:00 → 11:00, 21:00 → 13:00
name: publish
on:
  schedule:
    - cron: "30 23 * * *"
    - cron: "0 4 * * *"
    - cron: "0 9 * * *"
    - cron: "0 11 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Nomor slot 1–5 (kosong = deteksi dari jam WITA)"
        required: false
        type: string
      dry_run:
        description: "Override DRY_RUN untuk run ini saja (true/false). Kosong = pakai variabel repo."
        required: false
        type: string
      artifact_run_id:
        description: "ID run produce yang artifak MP4-nya dipakai (supaya tidak render ulang)"
        required: false
        type: string
permissions:
  contents: write
  actions: read
  models: read
# Satu publish pada satu waktu. Job yang menunggu lalu checkout main terbaru
# (plus guard already_published) mencegah double-publish jika cron GitHub
# dan cron-job.org memicu slot yang sama.
concurrency:
  group: reels-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Ambil main terbaru SETELAH antrean concurrency selesai,
          # supaya job kedua (GitHub cron + cron-job.org) membaca state yang sudah di-commit.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt
      - name: Tentukan DRY_RUN untuk run ini
        id: dry
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          VAR_DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
        run: |
          case "${INPUT_DRY_RUN}" in
            true|false|True|False|TRUE|FALSE)
              val=$(printf '%s' "${INPUT_DRY_RUN}" | tr '[:upper:]' '[:lower:]')
              echo "value=${val}" >> "$GITHUB_OUTPUT"
              ;;
            "")
              echo "value=${VAR_DRY_RUN}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Input dry_run tidak valid (true/false/kosong): ${INPUT_DRY_RUN}" >&2
              exit 1
              ;;
          esac
          echo "DRY_RUN efektif akan memakai output langkah ini (variabel repo tidak diubah)."
      - name: Unduh MP4 dari artifak produce
        if: ${{ inputs.artifact_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: reels-${{ inputs.artifact_run_id }}
          run-id: ${{ inputs.artifact_run_id }}
          path: data/jobs
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Letakkan MP4 di data/jobs/<tanggal>/slotN
        if: ${{ inputs.artifact_run_id != '' }}
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' f; do
            slotdir=$(basename "$(dirname "$f")")
            datedir=$(basename "$(dirname "$(dirname "$f")")")
            case "$slotdir" in slot[1-5]) ;; *) continue ;; esac
            case "$datedir" in 20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;; *) continue ;; esac
            dest="data/jobs/${datedir}/${slotdir}/reel.mp4"
            mkdir -p "$(dirname "$dest")"
            if [ "$(realpath "$f")" != "$(realpath -m "$dest")" ]; then
              cp -f "$f" "$dest"
            fi
            echo "MP4 siap: $dest ($(wc -c < "$dest") byte)"
            found=1
          done < <(find data/jobs -name 'reel.mp4' -print0)
          if [ "$found" -eq 0 ]; then
            echo "Artifak tidak berisi reel.mp4 yang dikenali." >&2
            find data/jobs -type f -print >&2
            exit 1
          fi
      - name: Tentukan slot dan publish
        env:
          PYTHONPATH: src
          DRY_RUN: ${{ steps.dry.outputs.value }}
          ALLOW_RERENDER: ${{ inputs.artifact_run_id != '' && 'false' || 'true' }}
          APPROVAL_MODE: ${{ vars.APPROVAL_MODE || 'required' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN || secrets.IG_TOKEN }}
          IG_TOKEN: ${{ secrets.IG_ACCESS_TOKEN || secrets.IG_TOKEN }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST || 'graph.facebook.com' }}
          IG_GRAPH_VERSION: ${{ vars.IG_GRAPH_VERSION || 'v21.0' }}
          GH_PAT: ${{ secrets.GH_PAT }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
          GITHUB_RELEASES_REPO: ${{ vars.GITHUB_RELEASES_REPO || github.repository }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          VIDEO_HOST_CHAIN: ${{ vars.VIDEO_HOST_CHAIN || 'github_release,r2,catbox' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          INPUT_SLOT: ${{ inputs.slot }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          python -m reels_autopilot poll || true
          # input slot (cron-job.org / dispatch) > cron GitHub > deteksi jam WITA
          SLOT=$(python -c "from reels_autopilot.config import resolve_publish_slot; import os; print(resolve_publish_slot(input_slot=os.environ.get('INPUT_SLOT'), schedule_cron=os.environ.get('SCHEDULE_CRON')))")
          echo "Slot=$SLOT DRY_RUN=$DRY_RUN ALLOW_RERENDER=$ALLOW_RERENDER"
          python -m reels_autopilot publish --slot "$SLOT"
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update state setelah publish"
          file_pattern: data/*.json
          commit_user_name: reels-autopilot[bot]
          commit_user_email: reels-autopilot[bot]@users.noreply.github.com
        continue-on-error: true

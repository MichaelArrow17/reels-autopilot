# Cadangan runner: GitLab CI (paket Free). Bukan jalur utama.
# Kuota menit GitLab Free BELUM DIVERIFIKASI dan mungkin tidak cukup untuk 5 video/hari.
# Pakai hanya jika GitHub Actions terhenti. Isi CI variables yang sama seperti GitHub Secrets.
# Jadwal: GitLab CI/CD schedules di UI (cron WITA=UTC+8, sama seperti .github/workflows).

stages: [scout, produce, publish]

default:
  image: python:3.12-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq ffmpeg git
    - pip install -r requirements.txt
    - export PYTHONPATH=src
    - export DRY_RUN="${DRY_RUN:-true}"

scout:
  stage: scout
  script:
    - python -m reels_autopilot scout
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $JOB == "scout"
    - if: $CI_PIPELINE_SOURCE == "web" && $JOB == "scout"

produce:
  stage: produce
  script:
    - python -m reels_autopilot poll || true
    - python -m reels_autopilot produce
  artifacts:
    paths: [data/jobs/**/*.mp4]
    expire_in: 2 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $JOB == "produce"
    - if: $CI_PIPELINE_SOURCE == "web" && $JOB == "produce"

publish:
  stage: publish
  script:
    - python -m reels_autopilot poll || true
    - python -m reels_autopilot publish --slot "${SLOT:-1}"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $JOB == "publish"
    - if: $CI_PIPELINE_SOURCE == "web" && $JOB == "publish"
